# prefact.yaml – configuration for prefact
package_name: mdflow

include:
  - "mdflow/**/*.py"
  - "tests/**/*.py"

exclude:
  - "**/__pycache__/**"
  - "**/venv/**"
  - "**/.venv/**"
  - "**/build/**"
  - "**/dist/**"
  - "examples/**"

rules:
  relative-imports:
    enabled: true
    severity: warning
  unused-imports:
    enabled: true
    severity: warning
    options:
      ignore_patterns:
        - "__future__"
  duplicate-imports:
    enabled: true
    severity: error
  wildcard-imports:
    enabled: true
    severity: error
  sorted-imports:
    enabled: false
    severity: info
  string-concat:
    enabled: true
    severity: info
  print-statements:
    enabled: true
    severity: info
    options:
      ignore_patterns:
        - "cli.py"
        - "__init__.py"
        - "validators.py"
  missing-return-type:
    enabled: false
    severity: info
