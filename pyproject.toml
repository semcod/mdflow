[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdflow"
version = "0.1.5"
description = "Markdown dependency analyzer — extract all dependencies, generate diagrams and charts"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["markdown", "dependencies", "diagrams", "mermaid", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Programming Language :: Python :: 3",
]
# No required dependencies — mdflow works with stdlib only.
# Optional: graphviz for SVG output.
dependencies = [
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
graphviz = ["graphviz>=0.20"]
dev = ["pytest>=7", "pytest-cov",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.scripts]
mdflow = "mdflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mdflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
